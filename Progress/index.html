<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'DM Sans', Arial, sans-serif;
}

.widget {
    width: 360px;
    padding: 26px 30px;
    box-sizing: border-box;

    background: #EAF3F8;
    border-radius: 24px;
}

.row {
    margin-bottom: 18px;
}

.row:last-child {
    margin-bottom: 0;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
}

.label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: #7F8C94;
    text-transform: uppercase;
}

.percentage {
    font-size: 12px;
    color: #78A6C3;
    font-weight: 500;
}

.bar-background {
    width: 100%;
    height: 8px;
    background: #D5E5EE;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: #78A6C3;
    border-radius: 20px;
    transition: width 0.5s ease;
}
</style>
</head>

<body>

<div class="widget">

    <div class="row">
        <div class="header">
            <div class="label">Year</div>
            <div class="percentage" id="year-percent">0.00%</div>
        </div>
        <div class="bar-background">
            <div class="bar" id="year-bar"></div>
        </div>
    </div>

    <div class="row">
        <div class="header">
            <div class="label">Month</div>
            <div class="percentage" id="month-percent">0.00%</div>
        </div>
        <div class="bar-background">
            <div class="bar" id="month-bar"></div>
        </div>
    </div>

    <div class="row">
        <div class="header">
            <div class="label">Week</div>
            <div class="percentage" id="week-percent">0.00%</div>
        </div>
        <div class="bar-background">
            <div class="bar" id="week-bar"></div>
        </div>
    </div>

    <div class="row">
        <div class="header">
            <div class="label">Day</div>
            <div class="percentage" id="day-percent">0.00%</div>
        </div>
        <div class="bar-background">
            <div class="bar" id="day-bar"></div>
        </div>
    </div>

</div>

<script>

function percentage(start, end, now) {
    return ((now - start) / (end - start)) * 100;
}

function updateProgress() {

    const now = new Date();

    /* YEAR */
    const yearStart = new Date(now.getFullYear(), 0, 1);
    const yearEnd = new Date(now.getFullYear() + 1, 0, 1);

    /* MONTH */
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
    const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1);

    /* WEEK - Monday to Sunday */
    const day = now.getDay();
    const mondayOffset = day === 0 ? -6 : 1 - day;

    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() + mondayOffset);
    weekStart.setHours(0, 0, 0, 0);

    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 7);

    /* DAY */
    const dayStart = new Date(now);
    dayStart.setHours(0, 0, 0, 0);

    const dayEnd = new Date(dayStart);
    dayEnd.setDate(dayStart.getDate() + 1);

    /* CALCULATE */
    const yearProgress = percentage(yearStart, yearEnd, now);
    const monthProgress = percentage(monthStart, monthEnd, now);
    const weekProgress = percentage(weekStart, weekEnd, now);
    const dayProgress = percentage(dayStart, dayEnd, now);

    /* UPDATE */
    updateBar("year", yearProgress);
    updateBar("month", monthProgress);
    updateBar("week", weekProgress);
    updateBar("day", dayProgress);
}

function updateBar(name, value) {

    value = Math.min(100, Math.max(0, value));

    document.getElementById(name + "-bar").style.width = value + "%";

    document.getElementById(name + "-percent").textContent =
        value.toFixed(2) + "%";
}

updateProgress();

setInterval(updateProgress, 1000);

</script>

</body>
</html>
