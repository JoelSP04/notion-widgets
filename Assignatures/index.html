```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'DM Sans', Arial, sans-serif;
}

.widget {
    width: 360px;
    padding: 26px 30px;

    background: #EAF3F8;
    border-radius: 24px;

    box-sizing: border-box;
}

.row {
    margin-bottom: 18px;
}

.row:last-child {
    margin-bottom: 0;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 7px;
}

.label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: #7F8C94;
    text-transform: uppercase;

    max-width: 250px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.percentage {
    font-size: 12px;
    color: #78A6C3;
    font-weight: 500;
    margin-left: 10px;
}

.bar-background {
    width: 100%;
    height: 8px;
    background: #D5E5EE;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: #78A6C3;
    border-radius: 20px;
    transition: width 0.6s ease;
}

.loading {
    text-align: center;
    font-size: 12px;
    color: #7F8C94;
    letter-spacing: 1px;
}

.error {
    text-align: center;
    font-size: 12px;
    color: #7F8C94;
}
</style>
</head>

<body>

<div class="widget" id="widget">
    <div class="loading">CARGANDO...</div>
</div>

<script>

const API_URL =
    "https://notion-semester-api-dsty.vercel.app/api/assignments";


async function loadAssignments() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Error al conectar con la API");
        }

        const data = await response.json();

        if (!data.success || !Array.isArray(data.tasks)) {
            throw new Error("Formato de datos incorrecto");
        }

        createWidget(data.tasks);

    } catch (error) {

        console.error(error);

        document.getElementById("widget").innerHTML =
            '<div class="error">NO SE HAN PODIDO CARGAR LOS DATOS</div>';
    }
}


function createWidget(tasks) {

    const subjects = {};

    /*
     * AGRUPAR TAREAS POR ASIGNATURA
     */

    tasks.forEach(task => {

        const subject = task.subject || "Sin asignatura";

        if (!subjects[subject]) {
            subjects[subject] = {
                total: 0,
                done: 0
            };
        }

        subjects[subject].total++;

        if (task.status === "Done") {
            subjects[subject].done++;
        }

    });


    const widget = document.getElementById("widget");

    widget.innerHTML = "";


    /*
     * CREAR UNA BARRA PARA CADA ASIGNATURA
     */

    Object.entries(subjects).forEach(([subject, data]) => {

        const percentage =
            data.total === 0
                ? 0
                : (data.done / data.total) * 100;


        const row = document.createElement("div");

        row.className = "row";


        row.innerHTML = `
            <div class="header">

                <div class="label">
                    ${subject}
                </div>

                <div class="percentage">
                    ${percentage.toFixed(0)}%
                </div>

            </div>

            <div class="bar-background">

                <div
                    class="bar"
                    style="width: ${percentage}%">
                </div>

            </div>
        `;


        widget.appendChild(row);

    });

}


/*
 * CARGAR DATOS AL ABRIR
 */

loadAssignments();


/*
 * ACTUALIZAR CADA 60 SEGUNDOS
 */

setInterval(loadAssignments, 60000);

</script>

</body>
</html>
```
